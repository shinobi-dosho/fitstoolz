# Publishes to PyPI when a v* tag is pushed.
#
# Release procedure:
#   1. Bump `version` in pyproject.toml, update CHANGELOG.md, land it on main.
#   2. git tag -a v0.1.0 -m 'fitstoolz 0.1.0' && git push origin v0.1.0
#
# The tag must match the version in pyproject.toml; the build job refuses to
# proceed otherwise, so a mistyped tag fails before anything reaches PyPI.
# PyPI does not allow a version to be re-uploaded, even after deletion.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install Python
      run: uv python install 3.12

    - name: Check the tag matches pyproject version
      run: |
        tag="${GITHUB_REF_NAME#v}"
        version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
        if [ "$tag" != "$version" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
          exit 1
        fi
        echo "releasing $version"

    # --locked, as in ci.yml: what gets published is what was tested against the
    # pinned dependency set, not a fresh resolve that happens at tag time.
    - name: Test
      run: uv run --locked --group tests pytest -q

    # A release is the last point at which a known-vulnerable pin can still be
    # kept off PyPI, so the same audit CI runs on every PR runs again here --
    # a tag can be cut weeks after the commit that last passed it.
    - name: Audit locked runtime dependencies
      run: |
        uv export --frozen --no-emit-project --no-default-groups --no-hashes \
          --format requirements-txt -o requirements-audit.txt
        uv run --locked --group audit pip-audit --no-deps --requirement requirements-audit.txt

    - name: Build sdist and wheel
      run: |
        rm -rf dist
        uv build

    - name: Check distribution metadata
      run: uvx twine check --strict dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fitstoolz

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    # Publishing is gated on the `pypi` environment, so the token is only
    # reachable from a run that got past the build job above.
    #
    # Worth upgrading to PyPI trusted publishing (OIDC) when convenient: add
    # `permissions: id-token: write` to this job, configure the publisher on
    # PyPI, and drop the `with:` block entirely -- that removes the long-lived
    # token from the repo's secrets altogether. It needs the PyPI-side setup
    # done first, so it is not changed here.
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_FITSTOOLZ_TOKEN }}
